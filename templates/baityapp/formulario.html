{% extends "baityapp/inicio.html" %}
{% load static %}

{% block contenido %}
<div class="main-container" style="max-width: 600px; margin: 0 auto;">
    <section class="form-section" id="preorder">
        <h2>Reportar Bug o Precomprar Humo</h2>
        
        <!-- Mensajito verde de éxito pulido para modo oscuro/claro -->
        {% if exito %}
            <div style="background-color: rgba(40, 167, 69, 0.1); color: #28a745; padding: 15px; margin-bottom: 20px; border-radius: 8px; border: 1px solid #28a745; text-align: center; font-weight: 600;">
                ¡Queja enviada al vacío con éxito!
            </div>
        {% endif %}

        <form method="POST" class="baity-form">
            {% csrf_token %}
            
            <!-- Datos del usuario autocompletados y bloqueados -->
            <div class="form-group">
                <label for="nombre">Tu Nick de Steam:</label>
                <input type="text" id="nombre" name="nick_steam" value="{{ user.username }}" readonly style="opacity: 0.6; cursor: not-allowed;" title="Ya sabemos quién eres.">
            </div>
            
            <div class="form-group">
                <label for="correo">Correo (para ignorar tus reclamaciones):</label>
                <input type="email" id="correo" name="correo" value="{{ user.email }}" readonly style="opacity: 0.6; cursor: not-allowed;">
            </div>
            
            <!-- 1. EL DESPLEGABLE DE LA EMPRESA (Conectado a la Base de Datos) -->
            <div class="form-group">
                <label for="entidad">Estudio a funar:</label>
                <select id="entidad" name="entidad_involucrada" required>
                    <option value="">Selecciona quién te robó...</option>
                    {% for ent in entidades %}
                        <option value="{{ ent.id_entidad }}">{{ ent.nombre }}</option>
                    {% endfor %}
                </select>
            </div>

            <!-- 2. EL DESPLEGABLE DEL TIPO DE ESTAFA -->
            <div class="form-group">
                <label for="tipo">Tipo de Estafa:</label>
                <select id="tipo" name="tipo_estafa" required>
                    <option value="Bug Catastrófico del Día 1">Bug Catastrófico del Día 1</option>
                    <option value="Juego a 80€ sin terminar">Juego a 80€ sin terminar</option>
                    <option value="Promesa falsa de Molyneux">Promesa falsa de Molyneux</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="mensaje">Cuéntanos tu sufrimiento:</label>
                <textarea id="mensaje" name="mensaje" rows="4" placeholder="Mi PC explotó al iniciar el menú principal..." required></textarea>
            </div>
            
            <button type="submit" class="btn-primary">Enviar Queja al Vacío</button>
        </form>
    </section>
</div>
{% endblock %}
