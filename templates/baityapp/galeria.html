{% extends "baityapp/inicio.html" %}
{% load static %}

{% block contenido %}
<div class="galeria-container">
    <h1>Galería para la nota</h1>
    
    <div class="galeria-grid">
        <!-- Bucle dinámico que recorre la estructura enviada desde la vista (BD) -->
        {% for item in elementos %}
            <div class="galeria-item">
                <!-- Fotografía -->
                {% if item.imagen %}
                    <img src="{{ item.imagen.url }}" alt="{{ item.nombre }}">
                {% else %}
                    <!-- Imagen por defecto si no subiste ninguna en el admin -->
                    <img src="{% static 'images/vaca.avif' %}" alt="Imagen no disponible">
                {% endif %}
                
                <!-- Tarjeta con los datos al pasar el cursor -->
                <div class="galeria-info">
                    <h3>{{ item.nombre }}</h3>
                    <span class="categoria">{{ item.categoria }}</span>
                    <p class="descripcion">{{ item.descripcion }}</p>
                </div>
            </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
