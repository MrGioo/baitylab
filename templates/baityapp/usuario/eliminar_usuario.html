{% extends "baityapp/inicio.html" %}

{% block contenido %}
<div class="main-container" style="max-width: 500px; margin: 4rem auto; padding: 0 15px;">
    <section class="form-section" style="text-align: center;">
        <h2 style="color: #dc3545; margin-bottom: 1rem;">¿Eliminar Usuario?</h2>
        
        <p style="color: var(--text); margin-bottom: 2rem; font-size: 1.1rem;">
            Estás a punto de borrar al usuario <strong>{{ usuario_steam.nick_steam }}</strong>. <br>
            ¡CUIDADO! Esto eliminará también todas sus quejas asociadas. <br><br>¿Seguro que quieres hacerlo?
        </p>

        <form method="POST">
            {% csrf_token %}
            <div style="display: flex; gap: 1rem; justify-content: center;">
                <a href="{% url 'mi_panel_admin' %}" class="btn-primary" style="background: transparent; color: var(--text-muted); border: 1px solid var(--card-border);">Cancelar</a>
                <button type="submit" class="btn-primary" style="background-color: #dc3545;">Sí, eliminar</button>
            </div>
        </form>
    </section>
</div>
{% endblock %}
