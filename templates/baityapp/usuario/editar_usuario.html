{% extends "baityapp/inicio.html" %}

{% block contenido %}
<div class="main-container" style="max-width: 600px; margin: 2rem auto; padding: 0 15px;">
    <section class="form-section">
        <h2 style="text-align: center; margin-bottom: 1.5rem; color: var(--text);">Editar Usuario Steam</h2>
        
        <form method="POST" class="baity-form">
            {% csrf_token %}
            <div class="form-group">
                <label>ID Usuario (No editable):</label>
                <input type="text" value="{{ usuario_steam.id_usuario }}" readonly style="opacity: 0.6; cursor: not-allowed;">
            </div>
            
            <div class="form-group">
                <label for="nick_steam">Nick de Steam:</label>
                <input type="text" id="nick_steam" name="nick_steam" value="{{ usuario_steam.nick_steam }}" required>
            </div>
            
            <div class="form-group">
                <label for="correo">Correo Electrónico:</label>
                <input type="email" id="correo" name="correo" value="{{ usuario_steam.correo }}" required>
            </div>
            
            <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                <a href="{% url 'mi_panel_admin' %}" class="btn-primary" style="background: transparent; color: var(--text-muted); border: 1px solid var(--card-border); text-align: center; flex: 0.4;">Cancelar</a>
                <button type="submit" class="btn-primary" style="flex: 1;">Guardar Cambios</button>
            </div>
        </form>
    </section>
</div>
{% endblock %}
